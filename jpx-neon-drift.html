<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14083a"><meta name="apple-mobile-web-app-capable" content="yes">
<title>JPX NEON DRIFT</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#14083a;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),x=cv.getContext('2d',{alpha:false}),F='"Trebuchet MS","Segoe UI",system-ui,sans-serif',R=(a,b)=>a+Math.random()*(b-a);
let W,H,D,S=1,st='menu',tm=0,sc=0,combo=0,cT=0,lives=3,shield=0,gun=1,inv=0,fT=0,sp=0,px=0,py=0,tx=0,ty=0,tilt=0,over=0,shake=0,muted=false,best=0,ac;
let B=[],E=[],K=[],P=[],Rg=[],stars=[];const SP={};
try{best=+localStorage.jpxnd||0;muted=localStorage.jpxm=='1'}catch(e){}
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w*D;c.height=h*D;const g=c.getContext('2d');g.scale(D,D);f(g);return c};
const poly=(g,a)=>{g.beginPath();a.forEach(([p,q],i)=>i?g.lineTo(p,q):g.moveTo(p,q));g.closePath()};
const en=(w,h,c1,c2)=>mk(w,h,g=>{const f=g.createLinearGradient(0,0,w,h);f.addColorStop(0,c1);f.addColorStop(1,c2);g.fillStyle=f;poly(g,[[w/2,h-2],[w-2,h*.22],[w*.72,h*.34],[w/2,2],[w*.28,h*.34],[2,h*.22]]);g.fill();g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1.2;g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(w/2,h*.42,w*.08,0,7);g.fill();g.fillStyle='#ff2d55';g.beginPath();g.arc(w/2,h*.42,w*.045,0,7);g.fill()});
const glow=c=>mk(64,64,g=>{const q=g.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,c);q.addColorStop(.3,c.replace('1)','.45)'));q.addColorStop(1,c.replace('1)','0)'));g.fillStyle=q;g.fillRect(0,0,64,64)});
function build(){
 SP.jet=mk(64,76,g=>{const f=g.createLinearGradient(0,0,64,0);f.addColorStop(0,'#6366f1');f.addColorStop(.5,'#eef2ff');f.addColorStop(1,'#6366f1');g.fillStyle=f;
  poly(g,[[32,2],[38,26],[62,54],[58,64],[40,56],[43,72],[32,67],[21,72],[24,56],[6,64],[2,54],[26,26]]);g.fill();g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.2;g.stroke();
  g.fillStyle='#f472b6';poly(g,[[10,58],[24,50],[24,56],[8,63]]);g.fill();poly(g,[[54,58],[40,50],[40,56],[56,63]]);g.fill();
  const c=g.createLinearGradient(0,14,0,38);c.addColorStop(0,'#fff');c.addColorStop(1,'#22d3ee');g.fillStyle=c;g.beginPath();g.ellipse(32,26,4.5,10,0,0,7);g.fill()});
 SP.d=en(44,46,'#ff7a9a','#9d174d');SP.s=en(54,50,'#fdba74','#c2410c');SP.t=en(84,78,'#a78bfa','#4c1d95');
 SP.b=mk(8,24,g=>{const f=g.createLinearGradient(0,0,0,24);f.addColorStop(0,'#fff');f.addColorStop(1,'rgba(34,211,238,.1)');g.fillStyle=f;g.beginPath();g.roundRect?g.roundRect(1,0,6,24,3):g.rect(1,0,6,24);g.fill()});
 SP.w=mk(34,34,g=>{g.fillStyle='#fbbf24';g.beginPath();g.arc(17,17,15,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.fillRect(15,8,4,18);g.fillRect(8,15,18,4)});
 SP.sh=mk(34,34,g=>{g.fillStyle='rgba(34,211,238,.3)';g.beginPath();g.arc(17,17,15,0,7);g.fill();g.strokeStyle='#67e8f9';g.lineWidth=3;g.stroke();g.fillStyle='#fff';poly(g,[[17,7],[26,11],[24,22],[17,27],[10,22],[8,11]]);g.fill()});
 SP.go=glow('rgba(255,170,60,1)');SP.gc=glow('rgba(80,230,255,1)');SP.gw=glow('rgba(255,255,255,1)')}
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);S=Math.max(.8,Math.min(W/380,1.3));build();
 SP.bg=mk(W,H,g=>{const l=g.createLinearGradient(0,0,W*.5,H);l.addColorStop(0,'#14083a');l.addColorStop(.5,'#35168a');l.addColorStop(1,'#1d4ed8');g.fillStyle=l;g.fillRect(0,0,W,H);
  [[.2,.2,.6,'#a855f7'],[.85,.6,.6,'#3b82f6'],[.3,.9,.5,'#ec4899']].forEach(([a,b,r,c])=>{const q=g.createRadialGradient(W*a,H*b,0,W*a,H*b,W*r);q.addColorStop(0,c+'55');q.addColorStop(1,c+'00');g.fillStyle=q;g.fillRect(0,0,W,H)})});
 stars=Array.from({length:70},()=>({x:R(0,W),y:R(0,H),z:R(.3,1)}));if(!px){px=tx=W/2;py=ty=H*.75}}
addEventListener('resize',rs);rs();
function snd(f,d=.1,t='sine',e=f,v=.1){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
 o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(e,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(z){}}
function boom(X,Y,s=1,c='#ffb347'){if(P.length<220)for(let i=0;i<14*s;i++){const a=R(0,6.3),v=R(60,260)*s;P.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.35,.8),m:.8,c:i%3?c:'#fff',r:R(2,4.5)})}Rg.push({x:X,y:Y,l:.45,m:.45,r:36*s})}
function reset(){st='play';tm=0;sc=0;combo=0;lives=3;shield=0;gun=1;inv=1;sp=.5;B=[];E=[];K=[];P=[];Rg=[];px=tx=W/2;py=ty=H*.75}
function die(){st='over';over=performance.now();boom(px,py,2.2);boom(px,py,1.4,'#ff4d6d');shake=.5;snd(260,.6,'sawtooth',40,.15);if(sc>best){best=sc;try{localStorage.jpxnd=Math.floor(best)}catch(e){}}}
function kill(e){boom(e.x,e.y,e.k=='t'?2:1);snd(e.k=='t'?120:200,.2,'square',50,.08);combo++;cT=2.5;sc+=({d:10,s:25,t:80})[e.k]*(1+Math.min(4,combo/5|0));E.splice(E.indexOf(e),1);
 if(Math.random()<(e.k=='t'?.6:.08))K.push({k:Math.random()<.5&&!shield||gun>=3?'s':'w',x:e.x,y:e.y})}
function upd(dt){tm+=dt;const df=Math.min(tm/70,1);sc+=dt*2;inv=Math.max(0,inv-dt);cT-=dt;if(cT<=0)combo=0;
 const a=1-Math.exp(-dt*14),ox=px;px+=(tx-px)*a;py+=(ty-py)*a;tilt+=((Math.max(-.5,Math.min(.5,(px-ox)*.12)))-tilt)*(1-Math.exp(-dt*12));
 fT-=dt;if(fT<=0){fT=.17;const o=gun==1?[0]:gun==2?[-9,9]:[-12,0,12];o.forEach(d=>B.push({x:px+d*S,y:py-30*S,vx:gun==3?d*5:0}));}
 sp-=dt;if(sp<=0){sp=Math.max(.32,.95-df*.6);const r=Math.random(),X=R(40,W-40);
  if(tm>28&&r>.9)E.push({k:'t',x:X,y:-50,vy:50+df*20,hp:7,w:84,h:78,ph:0,f:0});
  else if(tm>10&&r>.62)E.push({k:'s',x:X,x0:X,y:-40,vy:85+df*40,hp:2,w:54,h:50,ph:R(0,6),f:0});
  else E.push({k:'d',x:X,y:-40,vy:105+df*110,hp:1,w:44,h:46,ph:0,f:0})}
 for(let i=B.length-1;i>=0;i--){const b=B[i];b.y-=760*S*dt;b.x+=b.vx*dt;if(b.y<-30)B.splice(i,1)}
 for(let i=E.length-1;i>=0;i--){const e=E[i];e.y+=e.vy*S*dt;e.f=Math.max(0,e.f-dt);if(e.k=='s'){e.ph+=dt*2.2;e.x=e.x0+Math.sin(e.ph)*50*S}
  const hw=e.w*.38*S,hh=e.h*.38*S;let dead=0;
  for(let j=B.length-1;j>=0;j--){const b=B[j];if(Math.abs(b.x-e.x)<hw&&Math.abs(b.y-e.y)<hh+10){B.splice(j,1);e.hp--;e.f=.08;P.length<220&&P.push({x:b.x,y:b.y,vx:R(-90,90),vy:R(20,120),l:.25,m:.25,c:'#fff',r:2.5});if(e.hp<=0){kill(e);dead=1;break}}}
  if(dead)continue;
  if(Math.abs(e.x-px)<hw+14*S&&Math.abs(e.y-py)<hh+18*S&&inv<=0){if(shield){shield=0;inv=1;boom(e.x,e.y,1,'#67e8f9')}else{lives--;inv=1.8;shake=.3;boom(e.x,e.y)}E.splice(i,1);snd(150,.25,'sawtooth',50,.12);if(lives<=0){die();return}continue}
  if(e.y>H+80)E.splice(i,1)}
 for(let i=K.length-1;i>=0;i--){const k=K[i];k.y+=110*S*dt;if(Math.hypot(k.x-px,k.y-py)<34*S){if(k.k=='s')shield=1;else gun=Math.min(3,gun+1);snd(500,.25,'sine',1000);boom(k.x,k.y,.6,'#67e8f9');K.splice(i,1)}else if(k.y>H+40)K.splice(i,1)}}
const txt=(s,X,Y,z,c='#fff',w=800)=>{x.font=`${w} ${z}px ${F}`;x.fillStyle=c;x.fillText(s,X,Y)};
const spr=(s,X,Y,w,h,k=1)=>x.drawImage(s,X-w*k/2,Y-h*k/2,w*k,h*k);
function jet(X,Y,r,t){x.save();x.translate(X,Y);x.rotate(r);const f=1+.25*Math.sin(t/40);x.globalCompositeOperation='lighter';x.drawImage(SP.go,-14*S,22*S,28*S,(34+14*f)*S);x.globalCompositeOperation='source-over';spr(SP.jet,0,0,64*S,76*S);x.restore()}
let last=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.033,(t-last)/1000||0);last=t;if(innerWidth!=W||innerHeight!=H)rs();
 if(st=='play')upd(dt);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;if((p.l-=dt)<=0)P.splice(i,1)}
 for(let i=Rg.length-1;i>=0;i--)if((Rg[i].l-=dt)<=0)Rg.splice(i,1);shake=Math.max(0,shake-dt);
 x.drawImage(SP.bg,0,0,W,H);x.fillStyle='#fff';const fl=st=='play'?260:90;
 for(const s of stars){s.y+=fl*s.z*dt;if(s.y>H){s.y=-2;s.x=R(0,W)}x.globalAlpha=.25+s.z*.6;x.fillRect(s.x,s.y,s.z*2,s.z*2+s.z*fl/100)}x.globalAlpha=1;
 x.save();if(shake)x.translate(R(-1,1)*shake*14,R(-1,1)*shake*14);
 for(const b of B)spr(SP.b,b.x,b.y,8*S,24*S);
 for(const k of K){x.globalCompositeOperation='lighter';spr(SP.gw,k.x,k.y,60*S,60*S,.8);x.globalCompositeOperation='source-over';spr(k.k=='s'?SP.sh:SP.w,k.x,k.y+Math.sin(t/200)*3,34*S,34*S)}
 for(const e of E)spr(SP[e.k],e.x,e.y,e.w*S,e.h*S,1+e.f*1.5);
 if(st!='over'&&(inv<=0||Math.floor(t/70)%2)){jet(px,py,tilt,t);if(shield){x.strokeStyle=`rgba(103,232,249,${.6+.3*Math.sin(t/120)})`;x.lineWidth=3;x.beginPath();x.arc(px,py,40*S,0,7);x.stroke()}}
 x.globalCompositeOperation='lighter';for(const r of Rg){const q=1-r.l/r.m;x.globalAlpha=1-q;spr(SP.go,r.x,r.y,r.r*S*3*(.5+q),r.r*S*3*(.5+q));x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(r.x,r.y,r.r*S*(.3+q*1.5),0,7);x.stroke()}x.globalAlpha=1;
 for(const p of P){x.globalAlpha=p.l/p.m;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r)}x.globalAlpha=1;x.globalCompositeOperation='source-over';x.restore();
 x.textAlign='right';txt(muted?'🔇':'🔊',W-16,56,26);
 if(st=='play'){x.textAlign='left';txt(String(Math.floor(sc)),18,62,38);txt('BEST '+Math.floor(best),18,84,13,'#c4b5fd',600);
  for(let i=0;i<3;i++)txt('♥',W-100+i*26,86,24,i<lives?'#ff4d6d':'rgba(255,255,255,.2)');
  if(combo>1){x.textAlign='center';txt('COMBO x'+(1+Math.min(4,combo/5|0)),W/2,60,18,'#ffe14d')}}
 x.textAlign='center';
 if(st!='play'){x.fillStyle='rgba(15,6,50,.5)';x.fillRect(0,0,W,H);const z=Math.min(W*.2,88),m=Math.floor(t/500)%2;
  if(st=='menu'){const g=x.createLinearGradient(0,H*.17,0,H*.17+z);g.addColorStop(0,'#fff7ad');g.addColorStop(1,'#f59e0b');txt('JPX',W/2,H*.17+z*.85,z,g,900);
   txt('NEON DRIFT',W/2,H*.17+z*1.5,Math.min(W*.11,46),'#67e8f9',900);
   jet(W/2,H*.5+Math.sin(t/400)*8,Math.sin(t/900)*.12,t);
   txt('Drag to fly. Your jet fires by itself.',W/2,H*.66,Math.min(W*.045,18),'#e0e7ff',500);txt('আঙুল সরিয়ে উড়ো, শত্রু ধ্বংস করো',W/2,H*.66+28,Math.min(W*.045,18),'#c4b5fd',500);
   if(best)txt('Best: '+Math.floor(best),W/2,H*.76,22,'#fde68a')}
  else{txt('GAME OVER',W/2,H*.3,Math.min(W*.12,52),'#ff8fa3',900);txt(String(Math.floor(sc)),W/2,H*.3+72,66,'#fff',900);txt(sc>=best&&sc>0?'New best!':'Best: '+Math.floor(best),W/2,H*.3+106,22,'#fde68a')}
  if(m||st=='over')txt(st=='over'&&performance.now()-over<600?'':'TAP TO '+(st=='menu'?'START':'PLAY AGAIN'),W/2,H*.86,26,'#fff')}}
function ptr(e){tx=Math.max(20,Math.min(W-20,e.clientX));ty=Math.max(H*.35,Math.min(H*.88,e.clientY-70*S))}
cv.addEventListener('pointerdown',e=>{if(e.clientX>W-60&&e.clientY<70){muted=!muted;try{localStorage.jpxm=muted?'1':'0'}catch(z){}snd(500,.1);return}
 ptr(e);if(st=='menu'||(st=='over'&&performance.now()-over>600)){reset();snd(600,.15,'triangle',900)}});
cv.addEventListener('pointermove',ptr);
requestAnimationFrame(frame);
</script></body></html>
